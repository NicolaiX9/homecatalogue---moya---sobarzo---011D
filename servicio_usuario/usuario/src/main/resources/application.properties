spring.application.name=usuario


server.port = 9091



spring.datasource.url=jdbc:mysql://localhost:3306/db_usuarios?createDatabaseIfNotExist=true

spring.datasource.username=root

spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Ruta del Json de la documentación
springdoc.api-docs.path=/api/v1/usuarios/api-docs

#Título de la documentación
springdoc.swagger-ui.path=/swagger-ui.html 