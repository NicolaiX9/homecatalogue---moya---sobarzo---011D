server:
 port: 9090

spring:
   application:
      name: api-gateway
   cloud:
      gateway:
         globalcors:
            cors-configurations:
               '[/**]':
                  allowedOrigins: "http://localhost:9090"
                  allowedMethods:
                     -GET
                     -POST
                     -PUT
                     -DELETE
                     -OPTIONS
                  allowedHeades: "*"

            routes:
               cloud:
                  gateway:

                        # RUTA PARA EL SERVICIO DE USUARIOS
                           - id: usuarios-service
                             uri: http://localhost:9091
                             predicates:
                              - Path=/api/v1/usuarios/**

                        # RUTA PARA EL SERVICIO DE ALMACENES
                           - id: almacenes-service
                             uri: http://localhost:9092
                             predicates:
                           - Path=/api/v1/almacenes/**

                        #RUTA PARA EL SERVICIO DE STOCK
                           - id: stock-service
                             uri: http://localhost:9093
                             predicates:
                           - Path=/api/v1/stock/**

                        #RUTA PARA EL SERVICIO DE PRODUCTOS
                           - id: productos-service
                             uri: http://localhost:9094
                             predicates:
                           - Path=/api/v1/productos/**

                        # RUTA PARA EL SERVICIO DE CARRITOS
                           - id: carritos-service
                             uri: http://localhost:9095
                             predicates:
                           - Path=/api/v1/carritos/**
                           
eureka: 
   client:
      register-with-eureka: false 
      fetch-registry: false
   
springdoc:
   swagger-ui:
      urls:
      - name: Servicio pacientes
        url: /api/v1/pacientes/v3/api-docs
      - name: Servicio Gestión Médica
        url: /api/v1/v3/api-docs
