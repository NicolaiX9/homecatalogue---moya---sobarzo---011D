spring.application.name=distribuidores

server.port = 9097



spring.datasource.url=jdbc:mysql://localhost:3306/db_distribuidores?createDatabaseIfNotExist=true

spring.datasource.username=root

spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ruta donde se generará el JSON de la documentación

springdoc.api-docs.path=/api/v1/distribuidores/v3/api-docs

# Título de la documentación

springdoc.swagger-ui.path=/swagger-ui.html